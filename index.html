<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Το Εργαστήρι - Τουμαζάτος Νίκος: Μαθήματα Ζωγραφικής, Ελεύθερου Σχεδίου, Comic, Cartoon και Εικονογράφησης στον Πύργο.">
    <meta name="keywords" content="Ζωγραφική, Σχέδιο, Comic, Cartoon, Εικονογράφηση, Πύργος, Τουμαζάτος Νίκος, Το Εργαστήρι">
    <meta name="author" content="Τουμαζάτος Νίκος">
    
    <meta property="og:title" content="Το Εργαστήρι - Τουμαζάτος Νίκος">
    <meta property="og:description" content="Καλλιτεχνικό εργαστήρι στον Πύργο.">
    <meta property="og:image" content="images/index-layout.png">
    
    <title>Το Εργαστήρι - Τουμαζάτος Νίκος</title>

    <style>
        :root { --yellow-brand: #f1c40f; }
        
        body { 
            margin: 0; 
            background: #ffffff; 
            display: flex; 
            justify-content: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .main-layout { width: 100%; display: block; }

        #display-text {
            position: absolute;
            top: 22%; 
            width: 100%;
            text-align: center;
            color: var(--yellow-brand);
            font-weight: bold;
            font-size: 1.6em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            pointer-events: none;
            min-height: 1.5em;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        /* Language toggle */
        #lang-toggle {
            position: absolute;
            top: 2%;
            right: 2%;
            z-index: 20;
            background: rgba(0,0,0,0.45);
            color: var(--yellow-brand);
            border: 1px solid var(--yellow-brand);
            border-radius: 4px;
            padding: 3px 9px;
            font-size: 0.75em;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: background 0.2s ease;
        }

        #lang-toggle:hover {
            background: rgba(0,0,0,0.7);
        }

        .icon-link {
            position: absolute;
            background: rgba(255, 255, 255, 0); 
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s ease;
        }

        .icon-link:hover { transform: scale(1.15); }

        .footer-link {
            position: absolute;
            background: rgba(255, 255, 255, 0); 
            cursor: pointer;
            z-index: 5;
        }

        .btn-1 { top: 43%;    left: 1%;  width: 12%; height: 7%; } 
        .btn-2 { top: 50.3%;  left: 1%;  width: 12%; height: 7%; } 
        .btn-3 { top: 57.7%;  left: 1%;  width: 12%; height: 7%; } 
        .btn-4 { top: 43%;   right: 1%;  width: 12%; height: 7%; } 
        .btn-5 { top: 50.3%; right: 1%;  width: 12%; height: 7%; } 
        .btn-6 { top: 57.7%; right: 1%;  width: 12%; height: 7%; } 

        .f-addr { bottom: 13.5%; left: 25%; width: 50%; height: 4.5%; } 
        .f-tel  { bottom: 8.5%;  left: 30%; width: 40%; height: 4.5%; } 
        .f-mail { bottom: 3.5%;  left: 20%; width: 60%; height: 4.5%; } 
    </style>
</head>
<body>

<div class="wrapper">
    <div id="display-text"></div>

    <button id="lang-toggle" onclick="toggleLang()" aria-label="Switch language">EN</button>
    
    <img src="images/index-layout.png" alt="Το Εργαστήρι - Τουμαζάτος Νίκος" class="main-layout">

    <div class="icon-link btn-1" data-el="ΕΛΕΥΘΕΡΟ ΣΧΕΔΙΟ" data-en="FREE DRAWING"
         onmouseover="showText(this)" onmouseout="clearText()" aria-label="Ελεύθερο Σχέδιο"></div>
    <div class="icon-link btn-2" data-el="ΖΩΓΡΑΦΙΚΗ" data-en="PAINTING"
         onmouseover="showText(this)" onmouseout="clearText()" aria-label="Ζωγραφική"></div>
    <div class="icon-link btn-3" data-el="COMIC" data-en="COMIC"
         onmouseover="showText(this)" onmouseout="clearText()" aria-label="Comic"></div>
    <div class="icon-link btn-4" data-el="CARTOON" data-en="CARTOON"
         onmouseover="showText(this)" onmouseout="clearText()" aria-label="Cartoon"></div>
    <div class="icon-link btn-5" data-el="ΕΙΚΟΝΟΓΡΑΦΗΣΗ" data-en="ILLUSTRATION"
         onmouseover="showText(this)" onmouseout="clearText()" aria-label="Εικονογράφηση"></div>
    <div class="icon-link btn-6" data-el="PORTFOLIO" data-en="PORTFOLIO"
         onclick="openPortfolio()" onmouseover="showText(this)" onmouseout="clearText()" aria-label="Portfolio"></div>

    <a href="https://www.google.com/maps/search/?api=1&query=Παπαφλέσσα+47+Πύργος+27131"
       target="_blank" class="footer-link f-addr" aria-label="Διεύθυνση"></a>
    <a href="tel:6939637129" class="footer-link f-tel" aria-label="Τηλέφωνο"></a>
    <a href="mailto:toumazatosn@gmail.com" class="footer-link f-mail" aria-label="Email"></a>
</div>

<script>
    const display = document.getElementById('display-text');
    const toggle  = document.getElementById('lang-toggle');
    let lang = 'el';

    function showText(el) {
        display.innerText = lang === 'el' ? el.dataset.el : el.dataset.en;
        display.style.opacity = "1";
    }

    function clearText() {
        display.style.opacity = "0";
    }

    function openPortfolio() {
        window.location.href = "portfolio.html";
    }

    function toggleLang() {
        lang = lang === 'el' ? 'en' : 'el';
        toggle.innerText = lang === 'el' ? 'EN' : 'ΕΛ';
        document.documentElement.lang = lang === 'el' ? 'el' : 'en';
    }
</script>

</body>
</html>

    <style>
        :root { 
            --yellow-brand: #f1c40f;
            --dark-bg: rgba(0,0,0,0.45);
        }
        
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            background: #ffffff; 
            display: flex; 
            justify-content: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(241, 196, 15, 0.2);
            border-top: 3px solid var(--yellow-brand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loader.active { opacity: 1; }

        .main-layout { 
            width: 100%; 
            display: block; 
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .main-layout.loaded { opacity: 1; }

        #display-text {
            position: absolute;
            top: 22%; 
            width: 100%;
            text-align: center;
            color: var(--yellow-brand);
            font-weight: bold;
            font-size: 1.6em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            pointer-events: none;
            min-height: 1.5em;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        #lang-toggle {
            position: absolute;
            top: 2%;
            right: 2%;
            z-index: 20;
            background: var(--dark-bg);
            color: var(--yellow-brand);
            border: 1px solid var(--yellow-brand);
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        #lang-toggle:hover { 
            background: rgba(0,0,0,0.7);
            transform: scale(1.05);
        }

        #lang-toggle:focus-visible {
            outline: 2px solid var(--yellow-brand);
            outline-offset: 2px;
        }

        .icon-link {
            position: absolute;
            background: rgba(255, 255, 255, 0); 
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s ease;
            border-radius: 2px;
        }

        .icon-link:hover { 
            transform: scale(1.15);
        }

        .icon-link:focus-visible {
            outline: 2px solid var(--yellow-brand);
            outline-offset: -2px;
        }

        .footer-link {
            position: absolute;
            background: rgba(255, 255, 255, 0); 
            cursor: pointer;
            z-index: 5;
            border-radius: 2px;
        }

        .footer-link:focus-visible {
            outline: 2px solid var(--yellow-brand);
            outline-offset: 2px;
        }

        .btn-1 { top: 42%;    left: 0.5%;  width: 13%; height: 8%; } 
        .btn-2 { top: 49.5%;  left: 0.5%;  width: 13%; height: 8%; } 
        .btn-3 { top: 57%;    left: 0.5%;  width: 13%; height: 8%; } 
        .btn-4 { top: 42%;   right: 0.5%;  width: 13%; height: 8%; } 
        .btn-5 { top: 49.5%; right: 0.5%;  width: 13%; height: 8%; } 
        .btn-6 { top: 57%;   right: 0.5%;  width: 13%; height: 8%; } 

        .f-addr { bottom: 13.5%; left: 20%; width: 60%; height: 5%; } 
        .f-tel  { bottom: 8%;    left: 25%; width: 50%; height: 5%; } 
        .f-mail { bottom: 2.5%; left: 15%; width: 70%; height: 5%; } 

        html { scroll-behavior: smooth; }

        @media (max-width: 480px) {
            .btn-1, .btn-2, .btn-3, .btn-4, .btn-5, .btn-6 {
                width: 20%;
                height: 10%;
            }
            
            #display-text {
                font-size: 1.3em;
            }
        }
    </style>

<body>

<div class="wrapper">
    <div class="loader" id="loader"></div>
    <div id="display-text"></div>

    <button id="lang-toggle" onclick="toggleLang()" aria-label="Switch language" title="EN / ΕΛ">EN</button>
    
    <img

        class="main-layout"
        loading="lazy"
        title="Νικος Τουμαζατος - Ζωγράφος και Illustrator">

    <div class="icon-link btn-1" 
         data-el="ΕΛΕΥΘΕΡΟ ΣΧΕΔΙΟ" 
         data-en="FREE DRAWING"
         onmouseover="showText(this)" 
         onmouseout="clearText()"
         onkeydown="handleKeyDown(event, this)"
         tabindex="0"
         role="button"
         aria-label="Ελεύθερο Σχέδιο - Μαθήματα τεχνικής σχεδίασης"></div>

    <div class="icon-link btn-2" 
         data-el="ΖΩΓΡΑΦΙΚΗ" 
         data-en="PAINTING"

         onmouseout="clearText()"
         onkeydown="handleKeyDown(event, this)"
         tabindex="0"
         role="button"
         aria-label="Ζωγραφική - Μαθήματα ζωγραφικής για όλες τις ηλικίες"></div>

    <div class="icon-link btn-3" 
         data-el="COMIC" 
         data-en="COMIC"
         onmouseover="showText(this)" 
         onmouseout="clearText()"
         onkeydown="handleKeyDown(event, this)"
         tabindex="0"

    <div class="icon-link btn-4" 
         data-el="CARTOON" 
         data-en="CARTOON"

         onmouseout="clearText()"
         onkeydown="handleKeyDown(event, this)"
         tabindex="0"
         role="button"
         aria-label="Cartoon - Σχεδίαση χαρακτήρων και κινούμενης σχέδιασης"></div>

    <div class="icon-link btn-5"

         onmouseout="clearText()"

    <div class="icon-link btn-6" 
         data-el="PORTFOLIO" 
         data-en="PORTFOLIO"
         onclick="openPortfolio()" 
         onmouseover="showText(this)" 
         onmouseout="clearText()"
         onkeydown="handleKeyDown(event, this)"
         tabindex="0"
         role="button"
         aria-label="Portfolio - Δείτε τις δημιουργίες του Νικου Τουμαζατου"></div>

    <a href="https://www.google.com/maps/search/?api=1&query=Παπαφλέσσα+47+Πύργος+27131"
       target="_blank" 
       rel="noopener noreferrer"
       class="footer-link f-addr" 
       aria-label="Διεύθυνση: Παπαφλέσσα 47, Πύργος 27131"></a>

    <a href="tel:+306939637129" 
       class="footer-link f-tel" 
       aria-label="Τηλέφωνο: +30 693 96 37 129"></a>

    <a href="javascript:void(0)" 
       onclick="sendEmail()"
       class="footer-link f-mail" 
       aria-label="Αποστολή email στο toumazatosn@gmail.com"></a>
</div>

<script>
    const display = document.getElementById('display-text');
    const toggle = document.getElementById('lang-toggle');
    const loader = document.getElementById('loader');
    const image = document.getElementById('main-image');
    let lang = localStorage.getItem('site-lang') || 'el';

    updateLang();

    image.addEventListener('load', () => {
        loader.classList.remove('active');
        image.classList.add('loaded');
    });

    image.addEventListener('error', () => {
        loader.classList.remove('active');
        display.innerText = lang === 'el' ? '⚠️ Σφάλμα φόρτωσης' : '⚠️ Loading error';
        display.style.opacity = '1';
    });

    loader.classList.add('active');

    function showText(el) {
        display.innerText = lang === 'el' ? el.dataset.el : el.dataset.en;
        display.style.opacity = "1";
    }

    function clearText() {
        display.style.opacity = "0";
    }

    function openPortfolio() {
        window.location.href = "portfolio.html";
    }

    function toggleLang() {
        lang = lang === 'el' ? 'en' : 'el';
        localStorage.setItem('site-lang', lang);
        updateLang();
    }

    function updateLang() {
        toggle.innerText = lang === 'el' ? 'EN' : 'ΕΛ';
        document.documentElement.lang = lang;
    }

    function handleKeyDown(event, element) {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            if (element.classList.contains('btn-6')) {
                openPortfolio();
            }
        }
    }

    function sendEmail() {
        const email = atob('dG91bWF6YXRvc25AZ21haWwuY29t');
        window.location.href = 'mailto:' + email;
    }
</script>
